<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Pong Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>PONG GAME</h1>
        <div class="scoreboard">
            <div class="player-score">
                <h2>You</h2>
                <p id="playerScore">0</p>
            </div>
            <div class="game-status">
                <p id="gameStatus">TAP TO START</p>
            </div>
            <div class="computer-score">
                <h2>AI</h2>
                <p id="computerScore">0</p>
            </div>
        </div>
        <canvas id="pongCanvas" width="800" height="400"></canvas>
        
        <!-- Mobile Touchpad Area -->
        <div id="touchpadContainer" class="touchpad-container">
            <div class="touchpad" id="touchpad"></div>
            <p class="touchpad-hint">Swipe up/down to move paddle</p>
        </div>
        
        <!-- Mobile Control Buttons -->
        <div class="mobile-controls" id="mobileControls">
            <button id="startBtn" class="control-btn start-btn">START</button>
            <button id="resetBtn" class="control-btn reset-btn">RESET</button>
        </div>
        
        <div class="controls" id="desktopControls">
            <p><strong>Desktop:</strong> Use MOUSE or UP/DOWN ARROW keys</p>
            <p>Press SPACE to start/pause • Press R to reset</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
