<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>PONG GAME</h1>
        <div class="scoreboard">
            <div class="player-score">
                <h2>Player</h2>
                <p id="playerScore">0</p>
            </div>
            <div class="game-status">
                <p id="gameStatus">Press SPACE or TAP to Start</p>
            </div>
            <div class="computer-score">
                <h2>Computer</h2>
                <p id="computerScore">0</p>
            </div>
        </div>
        <canvas id="pongCanvas" width="800" height="400"></canvas>
        
        <!-- Mobile Controls -->
        <div class="mobile-controls" id="mobileControls">
            <button id="upBtn" class="control-btn">↑ UP</button>
            <button id="downBtn" class="control-btn">↓ DOWN</button>
            <button id="startBtn" class="control-btn start-btn">START/PAUSE</button>
        </div>
        
        <div class="controls">
            <p><strong>Desktop:</strong> Use MOUSE or UP/DOWN ARROW keys to move your paddle</p>
            <p><strong>Mobile:</strong> Tap UP/DOWN buttons to move your paddle</p>
            <p>Press SPACE or TAP START to start/pause the game</p>
            <p>Press R or TAP RESET to reset the game</p>
        </div>
        
        <button id="resetBtn" class="reset-btn">RESET</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
